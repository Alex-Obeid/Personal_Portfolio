<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 Plate — hatch ramp — Alex Obeid graphics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── tokens.css (excerpt) — already in your site, do not duplicate ── */
:root{--paper:#f0ebe1;--paper-shade:#e5dfd3;--ink:#0a0a0a;--orange:#f05a00;--orange-deep:#ab4000;--orange2:#ff7a1a;--warm-muted:#6b6459;
--bg:var(--paper);--fg:var(--ink);--fg-2:var(--warm-muted);--accent:var(--orange);--accent-text:var(--orange-deep);--on-accent:var(--ink);--surface:var(--paper-shade);
--rule:rgba(10,10,10,.20);--rule-strong:rgba(10,10,10,.85);--snap:.16s cubic-bezier(.4,0,.2,1);--territory-fade:.65s cubic-bezier(.4,0,.2,1);}
[data-territory="vermillion"]{--bg:var(--orange);--fg:var(--ink);--fg-2:rgba(10,10,10,.62);--accent:var(--ink);--accent-text:var(--ink);--on-accent:var(--orange);--surface:rgba(10,10,10,.07);--rule:rgba(10,10,10,.30);--rule-strong:rgba(10,10,10,.88);}
[data-territory="ink"]{--bg:var(--ink);--fg:var(--paper);--fg-2:rgba(240,235,225,.55);--accent:var(--orange);--accent-text:var(--orange);--on-accent:var(--ink);--surface:#161513;--rule:rgba(240,235,225,.20);--rule-strong:rgba(240,235,225,.85);}
/* ── system.css (excerpt) ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif}
.t-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase}
.terr{position:relative;background:var(--bg);color:var(--fg);padding:118px 48px 96px;overflow:clip}
.gfx{position:absolute;pointer-events:none;z-index:0}
.spec-mark{position:absolute;z-index:1;display:inline-flex;align-items:center;gap:7px;font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-2)}
.spec-mark .sm-bars{display:inline-flex;gap:2px}
.spec-mark .sm-bars i{width:2px;height:9px;background:currentColor;display:block}
.bar{display:block;width:46px;height:2px;background:var(--accent);flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ── demo harness only — delete when you lift the component ── */
html,body{height:100%}
.demo{height:100%;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 34px 32px}
.demo-hd{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;max-width:60%}
.demo-hd h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.6rem,4.4vw,2.9rem);line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
.demo-hd p{font-size:.8rem;line-height:1.55;color:var(--fg-2);max-width:32ch}
</style>

<!-- ══════════════════════════════════════════════════════════════════
     07 · PLATE — HATCH RAMP
     Slot     Project card artwork
     Ground   ink   Sizing  Fixed 16:10   Motion  Static
     The K4 E240 plate: 45° rules thickening across the field, stopped dead by one solid accent block.
     ══════════════════════════════════════════════════════════════════ -->
<style>
.gfx-plate{display:block;width:100%;height:100%;background:var(--bg);color:var(--accent)}
</style>
</head>
<body data-territory="ink">
<section class="terr demo" style="padding:34px" data-territory="ink">
  <div style="flex:1;min-height:0;display:flex"><div style="flex:1;border:1px solid var(--rule-strong);overflow:clip">
    <svg class="gfx-plate" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g fill="currentColor" transform="skewX(-22)"><rect x="-80.0" y="-60" width="1.5" height="340"/><rect x="-65.5" y="-60" width="2.4" height="340"/><rect x="-50.1" y="-60" width="3.3" height="340"/><rect x="-33.8" y="-60" width="4.2" height="340"/><rect x="-16.6" y="-60" width="5.1" height="340"/><rect x="1.5" y="-60" width="6.0" height="340"/><rect x="20.5" y="-60" width="6.9" height="340"/><rect x="40.4" y="-60" width="7.8" height="340"/><rect x="61.2" y="-60" width="8.7" height="340"/><rect x="82.9" y="-60" width="9.6" height="340"/><rect x="105.5" y="-60" width="10.5" height="340"/><rect x="129.0" y="-60" width="11.4" height="340"/><rect x="153.4" y="-60" width="12.3" height="340"/><rect x="178.7" y="-60" width="13.2" height="340"/><rect x="204.9" y="-60" width="14.1" height="340"/><rect x="232.0" y="-60" width="15.0" height="340"/><rect x="260.0" y="-60" width="15.9" height="340"/><rect x="288.9" y="-60" width="16.8" height="340"/></g>
      <rect x="268" y="0" width="52" height="200" fill="currentColor"/>
      <rect x="268" y="0" width="1" height="200" fill="var(--bg)"/>
    </svg>
  </div></div>
</section>
</body>
</html>
